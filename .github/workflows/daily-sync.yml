name: Daily Market Data Sync

on:
  schedule:
    # 13:00 UTC = 18:30 IST (every weekday Mon-Fri)
    - cron: "0 13 * * 1-5"
  workflow_dispatch: # allow manual trigger too

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance numpy pandas requests

      - name: Fetch latest Nifty data & regenerate ledger
        run: python .github/scripts/daily_sync.py

      - name: Pull latest remote changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Commit and push if changed
        run: |
          git add backend/calibrated_real_ledger.json frontend/src/lib/api.ts
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto daily sync $(date +'%Y-%m-%d')"
            git push origin main
          fi
