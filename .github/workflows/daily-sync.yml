name: Daily Market Data Sync

on:
  schedule:
    # 13:00 UTC = 18:30 IST (every weekday Mon-Fri)
    - cron: "0 13 * * 1-5"
  workflow_dispatch: # allow manual trigger too

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance numpy pandas requests

      - name: Fetch latest Nifty data & regenerate ledger
        run: python .github/scripts/daily_sync.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/calibrated_real_ledger.json frontend/src/lib/api.ts
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: auto daily sync $(date +'%Y-%m-%d')"
          for i in 1 2 3 4 5; do
            echo "Attempt $i: pushing to main..."
            git fetch origin main
            git rebase -X theirs origin/main || git rebase --abort
            if git push origin HEAD:main; then
              echo "Successfully pushed daily sync to main!"
              exit 0
            fi
            sleep 3
          done
          echo "Error: Failed to push to main after 5 attempts"
          exit 1
