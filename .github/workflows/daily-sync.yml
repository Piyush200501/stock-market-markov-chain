name: Daily Market Data Sync

on:
  schedule:
    # 13:00 UTC = 18:30 IST (every weekday Mon-Fri)
    - cron: "0 13 * * 1-5"
  workflow_dispatch: # allow manual trigger too

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance numpy pandas requests

      - name: Fetch latest Nifty data & regenerate ledger
        run: python .github/scripts/daily_sync.py

      - name: Commit updated ledger + api.ts if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/calibrated_real_ledger.json frontend/src/lib/api.ts
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: auto daily sync $(date +'%Y-%m-%d') [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
